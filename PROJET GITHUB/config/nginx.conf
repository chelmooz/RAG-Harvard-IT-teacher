# =============================================================================
# Prof IA v6.0 — Configuration Nginx (Reverse Proxy)
# =============================================================================
# FIX BUG#3 : Ce fichier était absent — le service nginx crashait au démarrage
#
# Architecture :
#   Browser → :8080 (nginx) → /api/*   → backend:8000 (FastAPI)
#                           → /*       → frontend:3000 (React)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain application/json application/javascript
                       text/css application/xml text/javascript;

    # ── Timeouts (généreux pour les requêtes Ollama sur BC-250) ───────────────
    proxy_connect_timeout  10s;
    proxy_send_timeout     200s;   # Ollama peut mettre jusqu'à 180s
    proxy_read_timeout     200s;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Serveur principal ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Taille max upload (documents PDF, audio) — doit être > upload côté FastAPI
        client_max_body_size 100M;

        # ── Headers de sécurité ───────────────────────────────────────────────
        add_header X-Frame-Options         "SAMEORIGIN"   always;
        add_header X-Content-Type-Options  "nosniff"      always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer-when-downgrade" always;

        # ── API Backend (/api/*  et /health) ──────────────────────────────────
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Health check direct ───────────────────────────────────────────────
        location /health {
            proxy_pass         http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── Docs Swagger (dev uniquement) ─────────────────────────────────────
        location /docs {
            proxy_pass         http://backend/docs;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location /openapi.json {
            proxy_pass         http://backend/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Frontend React (tout le reste) ────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";   # WebSocket React hot reload
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Gestion des erreurs ───────────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"error":"Service temporairement indisponible","status":503}';
            add_header Content-Type application/json;
        }
    }
}
