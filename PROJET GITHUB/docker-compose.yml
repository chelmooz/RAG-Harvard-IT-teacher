# =============================================================================
# Prof IA v6.0 — docker-compose AMD BC-250 (Cyan Skillfish / RDNA2)
# =============================================================================
# CORRECTIFS v6.0 :
#   pg18  : PostgreSQL 18.2 + pgvector (cohérent avec toute la documentation)
#   Ports : tous les services accessibles sur 0.0.0.0 (réseau local isolé)
#   CORS  : toutes origines autorisées (* — usage LAN uniquement)
#   JWT   : token libre, pas de contrainte (auth GitHub datasets)
#   root  : pas de restriction utilisateur dans les conteneurs
# =============================================================================

services:

  # PostgreSQL 18.2 + pgvector
  postgres:
    image: pgvector/pgvector:pg18
    container_name: prof-ia-postgres-v6.0
    restart: unless-stopped
    environment:
      POSTGRES_DB:              prof_ia_v5
      POSTGRES_USER:            user
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD:-user}
      POSTGRES_INITDB_ARGS:     "--encoding=UTF8"
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=256MB
        -c maintenance_work_mem=1GB
        -c max_parallel_workers_per_gather=3
        -c max_worker_processes=6
        -c wal_compression=zstd
        -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    networks:
      - prof-ia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d prof_ia_v5"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama AMD ROCm
  ollama:
    image: ollama/ollama:rocm
    container_name: prof-ia-ollama-rocm
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    environment:
      HSA_OVERRIDE_GFX_VERSION: "10.1.3"
      ROCR_VISIBLE_DEVICES:     "0"
      OLLAMA_KEEP_ALIVE:        "24h"
      OLLAMA_NUM_PARALLEL:      "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "0.0.0.0:11434:11434"
    networks:
      - prof-ia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.13"
        USE_ROCM: "true"
    container_name: prof-ia-backend-v6.0
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    environment:
      DATABASE_URL:             postgresql://user:${POSTGRES_PASSWORD:-user}@postgres:5432/prof_ia_v5
      OLLAMA_HOST:              http://ollama:11434
      OLLAMA_MODEL:             ${OLLAMA_MODEL:-mistral:7b-instruct-q4_K_M}
      HSA_OVERRIDE_GFX_VERSION: "10.1.3"
      ROCR_VISIBLE_DEVICES:     "0"
      PYTORCH_HIP_ALLOC_CONF:   "max_split_size_mb:512"
      RAG_THRESHOLD:            "0.72"
      RAG_TOP_K:                "5"
      CHUNK_SIZE:               "400"
      CHUNK_OVERLAP:            "80"
      ENABLE_LOGGING:           "true"
      AUTO_EVALUATE:            "true"
      GOLDEN_THRESHOLD:         "0.85"
      JWT_SECRET:               ${JWT_SECRET:-user}
      CORS_ORIGINS:             "*"
      UPLOAD_DIR:               "/app/data/uploads"
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/data/uploads
      - ./data/logs:/app/data/logs
    ports:
      - "0.0.0.0:8001:8000"
    networks:
      - prof-ia-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --loop uvloop
        --http h11

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prof-ia-frontend-v6.0
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8001
      - REACT_APP_VERSION=6.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - prof-ia-network
    depends_on:
      backend:
        condition: service_healthy

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: prof-ia-nginx-v6.0
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - prof-ia-network
    depends_on:
      - frontend
      - backend

networks:
  prof-ia-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
