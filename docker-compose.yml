# =============================================================================
# Prof IA v6.0 — docker-compose AMD BC-250 (Cyan Skillfish / RDNA2)
# =============================================================================
# CORRECTIFS v6.0 :
#   pg18  : PostgreSQL 18.2 + pgvector (cohérent avec toute la documentation)
#   Ports : tous les services accessibles sur 0.0.0.0 (réseau local isolé)
#   CORS  : toutes origines autorisées (* — usage LAN uniquement)
#   JWT   : token libre, pas de contrainte (auth GitHub datasets)
#   root  : pas de restriction utilisateur dans les conteneurs
# =============================================================================

services:

  # PostgreSQL 18.2 + pgvector
  postgres:
    image: pgvector/pgvector:pg18
    container_name: prof-ia-postgres-v6.0
    restart: unless-stopped
    # Limites mémoire/CPU : BC-250 = 16 Go GDDR6 UNIFIÉS (RAM+VRAM partagés).
    # À ajuster selon le profil (JEU vs RAG) ; valeurs conservatrices ci-dessous.
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "1.5"
        reservations:
          memory: 2g
          cpus: "1"
    environment:
      POSTGRES_DB:              prof_ia_v5
      POSTGRES_USER:            user
      # OBLIGATOIRE : pas de fallback faible. `docker compose up` échoue si
      # POSTGRES_PASSWORD n'est pas défini dans .env (voir .env.example).
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD:?"POSTGRES_PASSWORD manquant dans .env — obligatoire (plus de fallback faible)"}
      POSTGRES_INITDB_ARGS:     "--encoding=UTF8"
      # scram-sha-256 : authentification par mot de passe réelle.
      # (trust acceptait TOUTE connexion sans mot de passe — faille critique corrigée)
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=256MB
        -c maintenance_work_mem=1GB
        -c max_parallel_workers_per_gather=3
        -c max_worker_processes=6
        -c wal_compression=zstd
        -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback uniquement — plus exposé sur le LAN. Le backend accède via
      # le réseau Docker interne (profia-llama), pas via ce port publié.
      - "127.0.0.1:5432:5432"
    networks:
      - profia-llama
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d prof_ia_v5"]
      interval: 10s
      timeout: 5s
      retries: 5

# Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.13"
        # v1.4 : embeddings BGE-M3 et reranker tournent sur CPU. Le chemin GPU
        # de v1.4 est Vulkan/RADV, exécuté par llama.cpp SUR L'HÔTE (ADR-002),
        # pas ROCm dans le conteneur backend. Le knob reste lisible mais
        # explicitement désactivé : le demander est une décision, pas un défaut.
        USE_ROCM: "false"
    container_name: prof-ia-backend-v6.0
    restart: unless-stopped
    # Embeddings (bge-m3) + API : CPU en v1.4 (BGE-M3 CPU + reranker CPU).
    # 5 Go RAM laisse de la marge pour le contexte tout en protégeant le host.
    deploy:
      resources:
        limits:
          memory: 5g
          cpus: "3"
        reservations:
          memory: 3g
          cpus: "1.5"
    # /dev/dri uniquement : Vulkan/RADV pour llama.cpp côté hôte.
    # /dev/kfd (ROCm) est VOLONTAIREMENT ABSENT : ce nœud n'existe que sur un
    # hôte AMD, et son montage faisait échouer `docker compose up backend` hors
    # BC-250. La CI ne voyait pas le défaut car elle ne fait que `build`, pas `up`.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    # Résolution explicite vers la gateway du réseau profia-llama (ADR-003) :
    # host-gateway Docker pointe vers docker0 (172.17.0.1), pas vers 172.30.50.1.
    extra_hosts:
      - "llama-host:172.30.50.1"
    environment:
      DATABASE_URL:             postgresql://user:${POSTGRES_PASSWORD:?"POSTGRES_PASSWORD manquant dans .env"}@postgres:5432/prof_ia_v5
      # llama.cpp hôte (ADR-002/003) — endpoint canonique pour le backend
      LLAMA_SERVER_URL:         http://llama-host:8081
      # Aucune variable ROCm dans le chemin v1.4 (G2-T00) :
      # HSA_OVERRIDE_GFX_VERSION / ROCR_VISIBLE_DEVICES / PYTORCH_HIP_ALLOC_CONF
      # n'ont de sens qu'avec un torch ROCm, absent du chemin cible.
      RAG_THRESHOLD:            "0.72"
      RAG_TOP_K:                "5"
      CHUNK_SIZE:               "400"
      CHUNK_OVERLAP:            "80"
      ENABLE_LOGGING:           "true"
      AUTO_EVALUATE:            "false"
      GOLDEN_THRESHOLD:         "0.85"
      # FIX : config.py utilise API_TOKEN_SOURCE/API_TOKEN depuis le renommage
      # de JWT_SECRET — l'ancienne variable était ignorée silencieusement
      # (extra="ignore"), ce qui générait un token aléatoire à chaque restart
      # et cassait systématiquement l'auth frontend↔backend. Corrigé ici.
      API_TOKEN:                ${API_TOKEN:?"API_TOKEN manquant dans .env — obligatoire, doit être identique à REACT_APP_API_TOKEN côté frontend"}
      # Restreint par défaut aux origines connues du frontend (LAN). Ajoutez
      # d'autres IP/hosts séparés par des virgules dans .env si besoin.
      CORS_ORIGINS:             ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      UPLOAD_DIR:               "/app/data/uploads"
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/data/uploads
      - ./data/logs:/app/data/logs
    ports:
      - "0.0.0.0:8001:8000"
    networks:
      - profia-llama
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --loop uvloop
        --http h11

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prof-ia-frontend-v6.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
        reservations:
          memory: 512m
          cpus: "0.25"
    environment:
      - REACT_APP_API_URL=http://localhost:8001
      - REACT_APP_VERSION=6.0.0
      # Doit être strictement identique à API_TOKEN du service backend, sinon
      # api.js retombe sur le défaut 'dev-token' et toutes les requêtes échouent.
      - REACT_APP_API_TOKEN=${API_TOKEN:?"API_TOKEN manquant dans .env"}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - profia-llama
    depends_on:
      backend:
        condition: service_healthy

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: prof-ia-nginx-v6.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.25"
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - profia-llama
    depends_on:
      - frontend
      - backend

networks:
  profia-llama:
    # `name:` explicite : sans lui, compose préfixe le réseau par le nom du
    # projet (`rag-harvard-it-teacher_profia-llama`). Or
    # `deploy/systemd/profia-llama.service` verrouille son démarrage sur
    # `docker network inspect profia-llama` (ExecStartPre, exit 1 sinon) :
    # llama-server refuserait de démarrer alors que la stack monte sans erreur.
    name: profia-llama
    driver: bridge
    # Subnet/gateway EXPLICITES (ADR-003) — c'est la condition qui rend
    # `llama-host:172.30.50.1` dans `extra_hosts` vrai plutôt que décoratif.
    # Sans `ipam`, Docker attribue un subnet arbitraire : la gateway
    # `172.30.50.1` n'existerait pas, `llama-host` résoudrait vers une adresse
    # morte et l'échec ne se montrerait qu'à la première requête LLM.
    ipam:
      config:
        - subnet: 172.30.50.0/24
          gateway: 172.30.50.1

volumes:
  postgres_data:
    driver: local
