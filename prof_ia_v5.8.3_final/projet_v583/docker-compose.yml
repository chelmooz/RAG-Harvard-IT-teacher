# =============================================================================
# Prof IA v5.8.3 — docker-compose AMD BC-250 (Cyan Skillfish / RDNA2)
# =============================================================================
#
# CHANGELOG v5.8.3 :
#   [M1] user: root supprimé du frontend (inutile et mauvaise pratique)
#        user: root conservé UNIQUEMENT sur backend (requis pour Docker socket C4)
#        group_add: [video, render] conservé pour GPU sur backend
#   [M2] Architecture stockage documentée et explicitée :
#        NVMe 256Go → OS + Docker + postgres_data + ollama_data + chromadb_data
#        SSD USB 500Go → datasets + bibliothèque cours + ressources exportables
#   [M3] Commentaires de documentation ajoutés
#   [M4] Toutes les références de version uniformisées à 5.8.3
#
# ARCHITECTURE STOCKAGE BC-250 :
#   ┌─ NVMe 256Go (rapide — random I/O) ─────────────────────────────────────┐
#   │  /var/lib/docker/volumes/postgres_data   ← conversations PostgreSQL    │
#   │  /var/lib/docker/volumes/ollama_data     ← modèles Mistral + DeepSeek  │
#   │  /home/user/projet_v58/chromadb_data/   ← vecteurs RAG ChromaDB       │
#   │  /home/user/projet_v58/                 ← code projet + uploads        │
#   └────────────────────────────────────────────────────────────────────────┘
#   ┌─ SSD USB 500Go (portable — séquentiel) ────────────────────────────────┐
#   │  /mnt/ssd_cours/TSSR|AIS|DevOps/        ← datasets + cours            │
#   │  /mnt/ssd_cours/bibliotheque/           ← transcriptions JSON vidéo   │
#   │  /mnt/ssd_cours/exports/                ← tokens + ressources export  │
#   └────────────────────────────────────────────────────────────────────────┘
#
# PORTS :
#   http://192.168.1.11:3000  → Interface utilisateur React
#   http://192.168.1.11:8000  → API FastAPI (RAG + contrôle services)
#
# PRÉREQUIS BC-250 (à faire une seule fois après installation Debian) :
#   sudo usermod -aG docker user   ← déjà fait lors de l'install Docker
#   sudo usermod -aG video user    ← accès GPU depuis le compte user
#   sudo usermod -aG render user   ← accès GPU depuis le compte user
# =============================================================================

services:

  # ── PostgreSQL 16 + pgvector ──────────────────────────────────────────────
  # Stockage : volume nommé postgres_data → NVMe (random I/O intensif)
  # Accès réseau : 127.0.0.1:5432 uniquement (non exposé sur le LAN)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prof-ia-postgres-v58
    restart: always
    environment:
      POSTGRES_DB:               prof_ia_v5
      POSTGRES_USER:             user
      POSTGRES_PASSWORD:         ${POSTGRES_PASSWORD:-user}
      POSTGRES_INITDB_ARGS:      "--encoding=UTF8"
      # trust = authentification sans mot de passe en réseau Docker interne
      # Acceptable : PostgreSQL n'est pas exposé sur le LAN (127.0.0.1 uniquement)
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=256MB
        -c maintenance_work_mem=1GB
        -c max_parallel_workers_per_gather=3
        -c max_worker_processes=6
        -c wal_compression=zstd
        -c random_page_cost=1.1
    volumes:
      # NVMe — random I/O intensif (INSERT/SELECT conversations à chaque échange)
      # Ne jamais déplacer vers le SSD USB : latence USB tuerait les performances RAG
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - prof-ia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d prof_ia_v5"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama AMD ROCm ───────────────────────────────────────────────────────
  # Stockage : volume nommé ollama_data → NVMe (modèles ~10Go chargés au démarrage)
  # Accès réseau : 127.0.0.1:11434 uniquement (appelé par le backend, pas le client)
  ollama:
    image: ollama/ollama:rocm
    container_name: prof-ia-ollama-rocm
    restart: always
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    environment:
      # Cyan Skillfish (gfx1013) absent de la liste officielle ROCm — override requis
      HSA_OVERRIDE_GFX_VERSION: "10.1.3"
      ROCR_VISIBLE_DEVICES:     "0"
      OLLAMA_KEEP_ALIVE:        "24h"
      OLLAMA_NUM_PARALLEL:      "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      # NVMe — modèles Mistral 7B (~4.5Go) + DeepSeek R1 7B (~4.7Go)
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - prof-ia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend FastAPI ───────────────────────────────────────────────────────
  # [M1] user: root conservé ICI UNIQUEMENT car le Docker socket (/var/run/docker.sock)
  #      est requis pour les endpoints /services/status et /services/{name}/restart.
  #      Le socket appartient à root:docker — le processus doit être root ou dans
  #      le groupe docker du système hôte. Sur réseau LAN isolé, ce compromis est
  #      acceptable et documenté volontairement.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.13"
    container_name: prof-ia-backend-v58
    restart: always
    # user: root conservé intentionnellement pour accès Docker socket (voir commentaire ci-dessus)
    user: root
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    environment:
      DATABASE_URL:             postgresql://user:${POSTGRES_PASSWORD:-user}@postgres:5432/prof_ia_v5
      OLLAMA_HOST:              http://ollama:11434
      OLLAMA_MODEL:             ${OLLAMA_MODEL:-mistral:7b-instruct-q4_K_M}
      HSA_OVERRIDE_GFX_VERSION: "10.1.3"
      ROCR_VISIBLE_DEVICES:     "0"
      PYTORCH_HIP_ALLOC_CONF:   "max_split_size_mb:512"
      EMBEDDING_MODEL:          "sentence-transformers/all-MiniLM-L6-v2"
      CHROMADB_PATH:            "/app/chromadb_data"
      RAG_THRESHOLD:            "0.72"
      RAG_TOP_K:                "5"
      RAG_TOP_K_EXPLORE:        "12"
      RAG_TOP_K_SYNTHESIS:      "20"
      MMR_LAMBDA:               "0.7"
      MULTI_QUERY_COUNT:        "3"
      MULTI_QUERY_ENABLED:      "true"
      NUM_CTX_EXPLORE:          "8192"
      NUM_CTX_SYNTHESIS:        "16384"
      CHUNK_SIZE:               "400"
      CHUNK_OVERLAP:            "80"
      ENABLE_LOGGING:           "true"
      AUTO_EVALUATE:            "true"
      GOLDEN_THRESHOLD:         "0.85"
      JWT_SECRET:               ${JWT_SECRET:-user}
      UPLOAD_DIR:               "/app/data/uploads"
      COMPOSE_PROJECT_NAME:     "projet_v58"
    volumes:
      # Code projet — NVMe (bind mount volontaire : modifiable sans rebuild)
      # Note : COPY api/ est commenté dans le Dockerfile — choix volontaire pour
      # permettre les corrections rapides via nano/PuTTY sans docker compose build
      - ./backend:/app
      - ./data/uploads:/app/data/uploads
      - ./data/logs:/app/data/logs
      # ChromaDB vecteurs RAG — NVMe (random I/O intensif lors de chaque requête RAG)
      # Pré-indexé par import_datasets.py sur Windows, copié via WinSCP
      - ./chromadb_data:/app/chromadb_data
      # Docker socket — requis pour /services/status et /services/{name}/restart
      # Permet au backend de contrôler les conteneurs depuis le dashboard
      - /var/run/docker.sock:/var/run/docker.sock
      # SSD bibliothèque — décommenter quand SSD branché sur /mnt/ssd_cours :
      # - /mnt/ssd_cours:/app/data/bibliotheque:ro
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - prof-ia-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --loop uvloop
        --http h11

  # ── Frontend React ────────────────────────────────────────────────────────
  # [M1] user: root supprimé — le Dockerfile utilise nginx:alpine qui gère
  #      ses propres permissions. Aucun accès Docker socket requis ici.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prof-ia-frontend-v58
    restart: always
    # user: root supprimé [M1] — nginx:alpine n'en a pas besoin
    environment:
      - REACT_APP_API_URL=http://192.168.1.11:8000
      - REACT_APP_VERSION=5.8.3
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - prof-ia-network
    depends_on:
      backend:
        condition: service_healthy

# ── Réseau Docker interne ─────────────────────────────────────────────────────
networks:
  prof-ia-network:
    driver: bridge

# ── Volumes nommés → NVMe du BC-250 ─────────────────────────────────────────
# Docker stocke ces volumes dans /var/lib/docker/volumes/ sur le NVMe
# NE PAS déplacer vers le SSD USB (latence random I/O incompatible avec PostgreSQL/Ollama)
volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
